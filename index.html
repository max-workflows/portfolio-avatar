т і фінальний агент) і надсилає придатні оголошення дозволеним одержувачам у Telegram. Агент нічого не публікує: коментар залишає людина. Статус за словами автора: працює end-to-end, тестується й використовується командою клієнта.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B2", "question": "Яка роль автора в проєкті AI Scout?", "query": "AI Scout: роль автора, що зробив автор, внесок", "answer": "За описом, автор виділив Facebook-напрямок в окремий n8n-workflow, дослідив групи, написав JavaScript-обробку даних, інтегрував Apify, налаштував субагента й фінального агента, зробив PostgreSQL-перевірки, Google Sheets-доступи та приватну Telegram-доставку, а також адаптував систему після реального зворотного зв'язку користувачів.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B3", "question": "Як AI Scout збирає оголошення?", "query": "AI Scout: збір даних, Apify, Facebook групи, 12 груп, Facebook List", "answer": "Автор вручну відібрав **12 Facebook-груп** із ремонтними й будівельними оголошеннями. Для кожної в таблиці Facebook List зберігаються URL, ID, назва, ознака «лише текстові коментарі» (три групи) і ознака «увімкнено». Пости збирає Apify Actor (nice_dev/facebook-groups-posts-scraper): n8n формує вхід із URL групи та лімітів, запускає Actor і отримує dataset, а потім нормалізує пости, застосовує первинні фільтри, перевіряє актуальність і повтори.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B4", "question": "Що саме оцінює AI в AI Scout і які рішення приймає?", "query": "AI Scout: критерії, рішення, кваліфікація, шукає виконавця, реклама виконавця", "answer": "AI оцінює: чи шукає автор виконавця, чи рекламує власні послуги, яка робота потрібна, чи відповідає вона профілю команди, чи це бізнес-пропозиція, а не ремонтне замовлення, чи є явні умови, що роблять пропозицію непридатною. Рішення: справжній запит із відповідною роботою йде на фінальну перевірку; реклама виконавця й нерелевантні записи відхиляються; плиткове замовлення допускається до профільного потоку; оголошення з явним обмеженням, що виключає одержувачів, не доставляється; некоректний structured output не вважається успішною кваліфікацією. Наприклад, слово «szukam» саме по собі не доводить клієнтського наміру: автор може шукати ремонтні компанії, щоб запропонувати їм сайт чи маркетинг.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B5", "question": "Як виглядає Telegram-картка в AI Scout і чи публікує агент щось сам?", "query": "AI Scout: Telegram картка, Text Only, Media, кнопка, human-in-the-loop", "answer": "Агент **нічого не публікує, не веде переговорів і не приймає замовлень**: коментар завжди залишає людина. Картки двох типів: **Text Only** (з попередженням, що в групі можна лише текстовий коментар) і **Media** (з нагадуванням, що за правилами групи можна додати фото чи відео, яке користувач додає зі свого телефону). Обидві містять текст оголошення й кнопку «Відкрити пост і відповісти», яка веде до конкретного поста. Користувач читає картку, відкриває оригінал, перевіряє актуальність і умови та відповідає вручну.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B6", "question": "Що робить фільтр обмежень за громадянством у AI Scout?", "query": "AI Scout: фільтр громадянство національність, обмеження, nationality restriction", "answer": "Після того, як у реальних оголошеннях з'явились умови на кшталт «вимагається польське громадянство», бригадир попросив не показувати локальним одержувачам пропозиції, умови яких прямо їх виключають. Для цього додано поля `has_nationality_restriction` і `nationality_restriction_quote`: фільтр зберігає точну фразу-підставу й **не робить висновків за ім'ям автора, мовою чи номером телефону**. Автор наголошує, що це перевірка придатності для конкретного сценарію, а не автоматична юридична оцінка. Цей фільтр оцінюється за власними тестами, а не лише за наявністю інструкції в промпті.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B7", "question": "Як в AI Scout працює дедуплікація оголошень?", "query": "AI Scout: дедуплікація, PostgreSQL, повтори, DEDUP CHECK", "answer": "У **AI Scout** кожне оголошення має ключ (`listing_key`), і n8n перевіряє його запитом до PostgreSQL: `LEFT JOIN` до таблиці оголошень повертає прапорець `is_new` (true, якщо такого ключа ще немає). Запит завжди повертає рядок, а у вузлі PostgreSQL ввімкнено «Always Output Data», щоб гілка не зупинялась без відповіді. Далі вузол IF «DEDUP CHECK» за `is_new` відсіює дублікати. База спільна з багатоджерельним агентом, тому один пост не обробляється двічі.\n\nПовний SQL-запит і схема є на сторінці проєкту: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B8", "question": "Чому в AI Scout використано дві моделі?", "query": "AI Scout: дві моделі, Nemotron, gpt-4o-mini, економія", "answer": "Заради економії. Основні витрати **AI Scout** йдуть на Apify Actor, тому перший відбір робить субагент на безкоштовній моделі (nvidia/nemotron через OpenRouter), а платна **gpt-4o-mini** використовується лише для фінальної перевірки вже відібраних оголошень.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B9", "question": "Хто і як перекладає оголошення в AI Scout?", "query": "AI Scout: переклад оголошень, gpt-4o-mini, українська російська", "answer": "Переклад виконує сам фінальний агент на платній моделі **openai/gpt-4o-mini** через OpenRouter: за словами автора, вона добре справляється з цим і економна за токенами. Перекладається лише вже відібраний текст (не весь сирий потік), а оригінал береться зі source-даних і показується в картці зверху, переклад (українською, а для білорусів російською) нижче. Окремо перевіряються дві помилки: неправильно визначена придатність і неправильно перекладений зміст. На сторінці проєкту переклад названо напрямком розвитку, тож аватар не заявляє його як остаточно завершений.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B10", "question": "Де і як налаштовується AI Scout (конфігурація)?", "query": "AI Scout: налаштування, конфігурація, вузол Scout Settings", "answer": "Налаштування **AI Scout** зібрані в окремому вузлі n8n **Scout Settings**, який автор додав, щоб легко змінювати параметри без правки решти workflow. За описом на сторінці, він охоплює локації, категорії робіт, вікна свіжості, пороги оцінювання, ліміти джерел і налаштування доставки в Telegram. Список груп і правила коментування лежать окремо в таблиці. Скріншот вузла є на сторінці проєкту: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B11", "question": "Як в AI Scout вирішено проблему збоїв інструментів агента (резервний агент)?", "query": "AI Scout: збої інструментів агента, резервний агент, fallback, has_tool_error, 200 OK", "answer": "Основний агент іноді повертав успішний статус 200 OK, але з текстом помилки всередині (збій виклику інструмента), тож стандартний Retry On Fail його не ловив. Рішення: вузол нормалізації позначає такий лід прапорцем `has_tool_error`, вузол IF спрямовує його на **резервного агента** (Error check Agent), після чого результати зводяться назад вузлом Merge перед відправкою в Telegram. Автор свідомо не робив зациклення назад (обмеження n8n щодо циклічних залежностей і ризик зсуву індексів у Loop Over Items), а обрав лінійну паралельну гілку.\n\nСхема, імена вузлів і весь опис є на сторінці проєкту: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B12", "question": "Яку найскладнішу помилку автору довелось знайти в AI Scout?", "query": "AI Scout: найскладніша помилка, змішані дані, вузол Code, налагодження", "answer": "У бот приходили змішані дані. Причина була у вузлі **Code**: неправильний відступ у коді, візуально непомітний, змінював структуру виходу вузла й перемішував частину даних, і ця «каша» йшла далі. Автор закріпив дані (**Pin Data**), переглядав кожен вузол, поки не знайшов, де дані «течуть», а потім розбирав код уручну, рядок за рядком, і знову робив рев'ю з AI-агентом, поки причину не знайдено. Висновок автора: одного AI-ревю замало, потрібні закріплені дані й ручний розбір.\n\nДокладніше про цю автоматизацію: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B13", "question": "Як автор дізнається, що AI Scout зламався?", "query": "AI Scout: моніторинг, помилки, сповіщення в Telegram", "answer": "Через повідомлення в Telegram: це найпростіший і безкоштовний спосіб. Окремо в самому workflow є резервний агент (Error check Agent), який обробляє поодинокі збої AI-інструментів, щоб ліди не губились.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B14", "question": "Як в AI Scout тестуються зміни промптів?", "query": "AI Scout: тестування промптів, контрольні приклади, прототип", "answer": "Усі зміни автор спершу тестує локально на прототипі, і лише через деякий час після перевірки впроваджує їх у робочу версію. Поведінка після зміни промпта чи парсера перевіряється на контрольних прикладах: це таблиця даних (Data Table), підключена до агента як інструмент, з **26 реальними прикладами** різних випадків: від прихованої реклами до реальних оголошень з обмеженням за громадянством чи національністю.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B15", "question": "Як контролюється якість відбору в AI Scout?", "query": "AI Scout: якість відбору, статистика, PostgreSQL, відсіювання", "answer": "У **AI Scout** статистика відсіювання (що відхилив промпт і чому) ведеться в PostgreSQL. Автор також використовує контрольні приклади, щоб перевіряти поведінку після зміни промпта чи парсера. За цією статистикою промпт відсіює приблизно 75-85% постів, переважно різну рекламу (конкурентів, сіру чи приховану). Загалом, за спостереженнями автора, зі 100 зібраних оголошень після всіх етапів лишається приблизно 1-5, і ці оголошення ще розподіляються за доступами, тож кожен з одержувачів отримує свій обсяг. Точність відбору як відсоток вірних вердиктів автор не заявляє: сторінка прямо каже, що непідтверджена економія часу чи точність не подаються як досягнуті результати.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B16", "question": "Хто користується AI Scout і як налаштовано доступи?", "query": "AI Scout: користувачі, доступи, маршрутизація, n8n гілки", "answer": "Картки **AI Scout** отримують 5 людей, і в кожного свій доступ до інформації: наприклад, один з одержувачів бачить лише оголошення з плиточними роботами. Для цього автор зробив окрему гілку в n8n і вузол IF, який направляє потрібне оголошення у своє русло. Права доступу читаються з таблиці Google Sheets.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B17", "question": "Скільки коштує AI Scout Agent і від чого залежить обсяг збору?", "query": "AI Scout: вартість, бюджет, Apify, розклад запусків", "answer": "Обсяг збору в **AI Scout** залежить від бюджету клієнта: найбільше коштує Apify Actor. За оцінкою клієнта, увесь стек (Apify, близько 10 доларів на OpenRouter і хост) обходиться орієнтовно до 100 доларів на місяць. Розклад запусків автор виставляв за сумою, яку клієнт готовий платити, тому фіксованих обсягів постів на добу він не називає.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B18", "question": "Де працює AI Scout: локально чи на сервері?", "query": "AI Scout: де працює n8n, хост, деплой", "answer": "У портфоліо показано **прототип AI Scout**, розроблений у локальному середовищі автоматизації. Робоча версія для клієнта працює на сервері, а подробиці змін після прототипу автор не розголошує, бо це фріланс-проєкт.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B19", "question": "Чому для AI Scout обрано n8n, а не Make?", "query": "n8n чи Make: чому n8n, переваги n8n над Make", "answer": "За словами автора, з двох причин. По-перше, n8n економніший: у Make більше вузлів означає більше витрачених кредитів. По-друге, у n8n автоматизацію можна зробити лаконічною завдяки вузлу IF. У Make є роутер, але звичайна автоматизація там розростається у великого «павука», який важко обслуговувати, і чим більше вузлів, тим більша ймовірність помилки. Автор працює і з Make, і з n8n та обирає інструмент під задачу.\n\nДокладніше про цю автоматизацію: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "B20", "question": "Як AI Scout розвивався після відгуків користувачів і що далі?", "query": "AI Scout: розвиток, відгуки, що далі, багатоджерельна версія, плани", "answer": "Прототип мав три гілки збору (General, OLX, Facebook) із планом адаптації до німецького ринку. Після перегляду обсягу лідів клієнт вирішив зосередитись на Facebook-групах Варшави відповідно до місткості бригади: узгоджений обсяг виконано, а ширшу багатоджерельну версію призупинено до розширення бригади. Після перших Telegram-тестів з'ясувалось, що різним учасникам потрібні різні оголошення, потрібен переклад польського тексту й відсів явних обмежень: так з'явився окремий Facebook-workflow з персональними доступами. Далі: стабілізація structured output, завершення перекладу, узгодження спільної дедуплікації між агентами, окремий облік оголошень, рішень і доставок та накопичення відгуків користувачів.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Scout-Agent-Lead-Intelligence-for-Repair-Teams-Freelance-Projects-3e688deb8fea80d980f6d3c4c0b0dcc1"}, {"faq": "C1", "question": "Що таке AI Agent Board (Kanban + Second Brain)?", "query": "AI Agent Board: канбан і вікі з агентом Claude Code", "answer": "**AI Agent Board** — локальна канбан-дошка, де картки це Markdown-файли, поруч із вікі, яку веде AI-агент (Claude Code). Агент бере картку з Next, пише результат у файл і переносить у Review, а в Done її переносить лише людина. Є 149 unit-, 16 браузерних і 39 Python-тестів, CI зелений. Код відкритий: https://github.com/max-workflows/second-brain-kanban\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Agent-Board-Kanban-Second-Brain-for-Claude-Code-Independent-Projects-3fb88deb8fea8097b387db40bcb9f373"}, {"faq": "C2", "question": "Як працює Runner, агент, що виконує картки?", "query": "AI Agent Board: Runner, як працює агент, картка Next Review, Runs.md", "answer": "**Runner** це запланована рутина в застосунку Claude: щогодини в будні вона бере першу картку з колонки Next (картки з тегом `#needs-answer` пропускає), читає файл завдання, виконує його, пише результат у розділ Result, переносить картку в Review і додає рядок у журнал `Runs.md`. Межі: працює лише в папці сховища, не читає секретів, ніколи не переносить картку в Done (це робить лише людина) і бере одну картку за запуск. Якщо завдання незрозуміле, повертає картку в Next з тегом `#needs-answer`.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Agent-Board-Kanban-Second-Brain-for-Claude-Code-Independent-Projects-3fb88deb8fea8097b387db40bcb9f373"}, {"faq": "C3", "question": "Що показали перевірки Runner?", "query": "AI Agent Board: перевірка Runner, результати запусків, чотири запуски, токени", "answer": "Автор перевірив Runner чотирма запусками: два звичайні (результат звірено з вікі, цифри збіглися), один із завданням без опису (агент не вигадав завдання, а поставив питання й повернув картку), один із проханням прочитати `.env` за межами сховища (агент відмовився й пояснив причину). Тривалість запусків за годинником планувальника від 19 до 36 секунд, ручних промптів і переробок не було. Витрату токенів автор не вимірював, а чотири запуски не дають загальних висновків. Перевірка також виявила слабке місце в промпті (картка зі стопом блокувала чергу), і його виправлено.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Agent-Board-Kanban-Second-Brain-for-Claude-Code-Independent-Projects-3fb88deb8fea8097b387db40bcb9f373"}, {"faq": "C4", "question": "Які технології й тести використано в AI Agent Board?", "query": "AI Agent Board: стек, тести, CI, Next.js, Playwright", "answer": "Дошка зроблена на **Next.js, React, TypeScript, Tailwind і dnd-kit**; тести: **149 unit- і компонентних (Vitest), 16 браузерних (Playwright) і 39 Python-тестів** (хуки, lint-скрипт, ініціалізація сховища). На GitHub працює **CI** (GitHub Actions) із трьома завданнями: lint, unit і збірка; Python-тести; браузерні тести. Агент: Claude Code.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Agent-Board-Kanban-Second-Brain-for-Claude-Code-Independent-Projects-3fb88deb8fea8097b387db40bcb9f373"}, {"faq": "C5", "question": "Які правила має вікі в AI Agent Board?", "query": "AI Agent Board: вікі, правила, LLM Wiki, lint, хуки, другий мозок", "answer": "Вікі збудована за патерном **LLM Wiki**: `raw/` це незмінні джерела, `wiki/` це сторінки (джерела, сутності, концепції, висновки), індекс і журнал. Правила: джерела відокремлені від висновків, кожне твердження має посилання, суперечності позначаються й не виправляються мовчки, секрети з експортів не копіюються. Lint-скрипт перевіряє посилання, індекс, формат журналу й секрети, а хуки SessionStart і Stop змушують агента підтримувати індекс і журнал.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Agent-Board-Kanban-Second-Brain-for-Claude-Code-Independent-Projects-3fb88deb8fea8097b387db40bcb9f373"}, {"faq": "C6", "question": "Як дошка працює разом з Obsidian?", "query": "AI Agent Board: Obsidian, плагін Kanban, синхронізація, Markdown", "answer": "Дошка це один файл `Kanban.md` у форматі плагіна Kanban для Obsidian плюс окремі файли карток у `Tasks/`. Правки з Obsidian з'являються на веб-дошці приблизно за 2 секунди і навпаки; автор перевірив це вручну з плагіном. Запис файлів атомарний, і перед записом файл перечитується, бо його може редагувати і Obsidian, і агент.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Agent-Board-Kanban-Second-Brain-for-Claude-Code-Independent-Projects-3fb88deb8fea8097b387db40bcb9f373"}, {"faq": "C7", "question": "Як у AI Agent Board захищено приватні дані?", "query": "AI Agent Board: безпека, приватність, сканер секретів, локальний сервер", "answer": "Сервер слухає лише локальну адресу (`127.0.0.1`) і відмовляє запитам не з локальної машини. Особисті дані лежать в окремій папці, яку Git ігнорує. Перед кожним комітом працює сканер, що блокує токени, вебхуки, адреси пошти й особисті шляхи, а в репозиторії лишається тільки демо-сховище з вигаданими даними. Видалені картки архівуються, а не стираються.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Agent-Board-Kanban-Second-Brain-for-Claude-Code-Independent-Projects-3fb88deb8fea8097b387db40bcb9f373"}, {"faq": "C8", "question": "Чому AI Agent Board називають економним?", "query": "AI Agent Board: економія, вартість, без хостингу, токени", "answer": "Це проєктні рішення, а не виміряна економія: немає хостингу й бази даних, рутини нічого не роблять без роботи (порожній запуск Runner тривав 7-19 секунд), на старті сесії агент отримує лише короткий контекст, а механічні перевірки виконує скрипт без викликів моделі. Скільки токенів витрачає картка, автор поки не вимірював.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Agent-Board-Kanban-Second-Brain-for-Claude-Code-Independent-Projects-3fb88deb8fea8097b387db40bcb9f373"}, {"faq": "C9", "question": "Звідки ідея AI Agent Board і чи це копія курсу?", "query": "AI Agent Board: походження, курс Ed Donner, чи це копія, ідея", "answer": "Дошка слідує завданню Тижня 1 курсу «AI Coder» Еда Доннера, але значно його розширює: зберігання у Markdown, вікі зі схемою, хуки, lint, Runner з обмеженнями, CI і публічний репозиторій. За історією репозиторію, він починається зі стандартного шаблону Next.js, а весь код написано разом із Claude Code. Ідея вікі за шаблоном «LLM Wiki». У портфоліо проєкт позначено як Independent.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Agent-Board-Kanban-Second-Brain-for-Claude-Code-Independent-Projects-3fb88deb8fea8097b387db40bcb9f373"}, {"faq": "C10", "question": "Де код AI Agent Board і яка в нього ліцензія?", "query": "AI Agent Board: код, GitHub, ліцензія MIT, репозиторій, запустити", "answer": "Код відкритий на GitHub: https://github.com/max-workflows/second-brain-kanban. Ліцензія **MIT**. У README описано, як запустити дошку (`npm install`, `npm run dev` або `start.cmd` на Windows), як налаштувати власне сховище й як запустити тести; є демо-сховище з вигаданими даними.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Agent-Board-Kanban-Second-Brain-for-Claude-Code-Independent-Projects-3fb88deb8fea8097b387db40bcb9f373"}, {"faq": "D1", "question": "Розкажи про AI-скоринг лідів для онлайн-школи", "query": "AI Lead Scoring для онлайн-школи: Make, Google Forms, Telegram", "answer": "**AI Lead Scoring 24/7** (Make): заявка з Google Forms очищується, перевіряється на дублікат, AI оцінює рівень інтересу (гарячий, середній, холодний, спам) і генерує відповідь, лід отримує її на email, а менеджер у Telegram бачить лише гарячих. За вимірами автора, час першої відповіді скоротився з 15-120 хвилин до менше ніж 30 секунд. Зростання надходження учнів на 15-25% автор називає прогнозом.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-24-7-50588deb8fea820185bc0138e44e1098"}, {"faq": "D2", "question": "Чи працював AI Lead Scoring у реальній школі і який його статус?", "query": "AI Lead Scoring: реальна школа, статус, чи працює, використання", "answer": "Так, система працювала для **реальної онлайн-школи** під час набору на онлайн-курс і його проведення. Після цього школа цією діяльністю більше не займається, тому зараз система не діє. Цифри результатів (час першої відповіді, збереження всіх заявок, економія часу менеджерів) виміряні автором на практиці; зростання надходження учнів він називає прогнозом.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-24-7-50588deb8fea820185bc0138e44e1098"}, {"faq": "D3", "question": "Як саме AI оцінює ліда в AI Lead Scoring?", "query": "AI Lead Scoring: як оцінюється лід, промпт, класифікація, гарячий середній холодний", "answer": "Оцінка робиться **одним промптом**. Йому задано роль менеджера освітньої компанії, а на вхід іде текст повідомлення з форми та статус із перевірки на дублікат: перше звернення чи повторне. Для повторного AI має зрозуміти, чому людина звертається знову і що заважало записатися, і відповісти більш персоналізовано.\n\nРівні інтересу прості: **гарячий** (хоче записатися, питає про ціну, терміни, оплату), **середній** (цікавиться деталями курсу), **холодний** (загальні питання) і **спам**. AI повертає два рядки, рівень інтересу і готову відповідь клієнту, а сценарій Make їх розбирає: гарячий лід іде менеджеру в Telegram, відповідь іде ліду на пошту.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-24-7-50588deb8fea820185bc0138e44e1098"}, {"faq": "D4", "question": "Який був масштаб AI Lead Scoring: скільки заявок і скільки учнів?", "query": "AI Lead Scoring: масштаб, кількість заявок, група, 20 учнів", "answer": "Проєкт працював у невеликому масштабі: курс набрали в **групу з 20 осіб**. Група невелика навмисно, бо з кожним учнем займався ментор. Скільки саме заявок прийшло за цикл, автор не фіксував у відкритому вигляді, тому точного числа тут немає. Тож це приклад робочої автоматизації для малої школи, а не високонавантаженої системи.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-24-7-50588deb8fea820185bc0138e44e1098"}, {"faq": "D5", "question": "Скільки коштувало запустити AI Lead Scoring?", "query": "AI Lead Scoring: вартість, тариф Make, безкоштовний, кредити", "answer": "Make-частина не коштувала нічого: усе було розраховано на **безкоштовний тариф Make з 1000 кредитів**, і набір на курс у нього вклався. Це показує, що для малої школи така автоматизація може бути дуже дешевою. Вартість самих AI-запитів автор окремо не називав, тому точної суми тут немає.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-24-7-50588deb8fea820185bc0138e44e1098"}, {"faq": "D6", "question": "Як виміряно, що AI Lead Scoring відповідає менш ніж за 30 секунд?", "query": "AI Lead Scoring: час відповіді, 30 секунд, як виміряно, тестування", "answer": "Значення «менше 30 секунд» автор отримав **під час тестування** сценарію: від надходження заявки до відповіді ліду. Це результат тестових прогонів, а не статистика за весь цикл набору. Попередні 15-120 хвилин це типовий час ручної відповіді, яку система мала замінити.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-24-7-50588deb8fea820185bc0138e44e1098"}, {"faq": "D7", "question": "Були збої чи помилки скорингу в AI Lead Scoring, і як вони оброблялися?", "query": "AI Lead Scoring: помилки, збої, надійність, обробка помилок", "answer": "За словами автора, **проблем зі скорингом чи падінь сценарію не було**: набір у групу був невеликим, і все відпрацювало добре. Окремої обробки помилок для цього проєкту автор не описував, тому не стверджується, що вона була. Для більш навантажених систем це було б обов'язковою частиною. Приклад: у проєкті AI Scout є запасний агент на випадок збою.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-24-7-50588deb8fea820185bc0138e44e1098"}, {"faq": "D8", "question": "Звідки взявся AI Lead Scoring і хто його перевіряв?", "query": "AI Lead Scoring: курс AI в маркетингу та продажах, Promodo, валідація, домашка, Олег Волков, відгук, скріншот", "answer": "Спочатку це була **реальна автоматизація для онлайн-школи**. Пізніше автор використав її як домашню роботу курсу **«AI в маркетингу та продажах»** від Eastern Ukraine EDIH, Promodo Academy та Kharkiv IT Cluster: завдання було згенерувати та змоделювати кейс, а він узяв свій справжній проєкт. Архітектуру й сегментацію перевірив **Олег Волков, практикуючий PPC-спеціаліст агенції Promodo, який також викладає програми з AI в маркетингу та продажах**, і автор отримав експертну валідацію проєкту. **Скріншот відгуку** (опублікований з дозволу Олега Волкова) є на сторінці проєкту.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-24-7-50588deb8fea820185bc0138e44e1098"}, {"faq": "D9", "question": "Які інструменти використано в AI Lead Scoring?", "query": "AI Lead Scoring: стек, Make, GenAI API, Google Forms, Sheets, Gmail, Telegram", "answer": "**Make** (сценарій), **GenAI API** (класифікація й персоналізована відповідь), **Google Forms** (заявки), **Google Sheets** (перевірка дубліката й аналітика), **Gmail** (відповідь ліду) та **Telegram Bot** (сповіщення менеджеру про гарячих лідів). Кастомного коду в цій схемі немає, це no-code система.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-24-7-50588deb8fea820185bc0138e44e1098"}, {"faq": "D10", "question": "Для яких аудиторій були офери в AI Lead Scoring?", "query": "AI Lead Scoring: сегменти, офери, початківці, фрілансери, власники бізнесу, фільтри відсіювання", "answer": "Для школи автор розробив **три окремі офери під сегменти аудиторії** з фільтрами відсіювання нецільових заявок: **початківці без досвіду в IT**, **діючі фрілансери та маркетологи** і **власники малого бізнесу**. Архітектуру й сегментацію переглянув Олег Волков, практикуючий PPC-спеціаліст агенції Promodo.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-24-7-50588deb8fea820185bc0138e44e1098"}, {"faq": "E1", "question": "Що за помилка Instagram 9007 і як автор її усунув?", "query": "Content Factory: помилка Instagram API 9007 у Make", "answer": "**Content Factory** публікує контент з RSS у Telegram, Facebook Pages, Threads та Instagram. Помилка 9007 виникала, коли Meta ще не обробила медіа, а Make уже публікував. Рішення: HTTP-модулі Instagram Graph API замість нативного модуля, створення контейнера, 10 перевірок статусу кожні 30 секунд і публікація лише при статусі FINISHED; зображення отримують стабільні посилання через ImageKit. Після виправлення публікація працює стабільно, цифр автор не наводить.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Content-Factory-Instagram-API-Error-9007-16b88deb8fea83a4b1208199fa35756a"}, {"faq": "E2", "question": "Чи був Content Factory фріланс-проєктом і чи працює він зараз?", "query": "Content Factory: фріланс, клієнт, статус, чи працює", "answer": "Так, це **фріланс-проєкт**. Зараз система **не працює**: вона виконала свою функцію. За спостереженням автора, **після оновлення Make проблема зникла**, тому обхідне рішення більше не потрібне. Автор вважає, що ті, хто досі скаржиться на цю помилку, просто не оновили версію, але це його припущення. Цінність кейсу в підході: знайти причину критичної помилки Instagram 9007 і замінити нативний модуль на HTTP-модуль з Repeater, після чого публікація працювала стабільно.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Content-Factory-Instagram-API-Error-9007-16b88deb8fea83a4b1208199fa35756a"}, {"faq": "E3", "question": "Який обсяг контенту випускав Content Factory?", "query": "Content Factory: обсяг, скільки постів, як часто, крипто, Telegram Threads Facebook Instagram", "answer": "Це був **контент-завод, який пропрацював приблизно місяць**. Контент був про крипту й публікувався у **чотири місця**: Telegram-канал, Threads, Facebook та Instagram. Щодня виходило **3-4 пости**, і кожен **адаптувався під кожну мережу** окремим промптом, тож за місяць це близько 90-120 постів і приблизно 360-480 публікацій. Це оцінка автора з пам'яті, а не дані з логів.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Content-Factory-Instagram-API-Error-9007-16b88deb8fea83a4b1208199fa35756a"}, {"faq": "E4", "question": "Як Content Factory адаптував пост під різні мережі?", "query": "Content Factory: адаптація тексту під мережу, промпт, Threads, формат, тон", "answer": "Основний текст статті не копіювався, а **переписувався окремим промптом під кожну мережу**. Наприклад, для Threads промпт вимагає до 400 символів, розмовний і дружній тон, 1-3 короткі речення, сильний гачок або питання для обговорення, 1-3 емодзі й жодних фраз на кшталт «посилання в профілі», без надто рекламного тону. Для інших мереж були свої промпти зі своїми правилами. Тексти промптів повністю тут не наводяться.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Content-Factory-Instagram-API-Error-9007-16b88deb8fea83a4b1208199fa35756a"}, {"faq": "E5", "question": "Які AI-моделі використовував Content Factory?", "query": "Content Factory: моделі, GPT-4o, DALL-E 3, картинки, рерайт", "answer": "Для **рерайту текстів** на той час використовувалась **GPT-4o** (із системним промптом), а **картинки генерувались у DALL-E 3** за промптами. Це були моделі, доступні на момент проєкту.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Content-Factory-Instagram-API-Error-9007-16b88deb8fea83a4b1208199fa35756a"}, {"faq": "E6", "question": "Як працює Content Factory крок за кроком?", "query": "Content Factory: як працює, RSS, рерайт, ImageKit, Router, чотири гілки, Google Sheets", "answer": "1) RSS-тригер і очищення контенту. 2) Рерайт тексту через OpenAI, а зображення отримує стабільне посилання через ImageKit. 3) **Router** розподіляє контент на чотири незалежні гілки: Telegram, Facebook Pages, Threads та Instagram (з окремою логікою). 4) Дані про кожну публікацію й статус записуються в Google Sheets для аналітики.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Content-Factory-Instagram-API-Error-9007-16b88deb8fea83a4b1208199fa35756a"}, {"faq": "E7", "question": "Які інструменти використано в Content Factory?", "query": "Content Factory: стек, Make, OpenAI, ImageKit, HTTP, Instagram Graph API, RSS, Telegram, Facebook, Threads", "answer": "**Make**, **OpenAI GPT-4o** (рерайт), **DALL-E 3** (картинки), **HTTP-модулі й Repeater** замість нативного Instagram-модуля, **ImageKit** (CDN), **Instagram Graph API**, **RSS**, Telegram, Facebook Pages, Threads і **Google Sheets**.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Content-Factory-Instagram-API-Error-9007-16b88deb8fea83a4b1208199fa35756a"}, {"faq": "E8", "question": "Навіщо в Content Factory знадобився ImageKit?", "query": "Content Factory: ImageKit, CDN, короткострокові посилання, медіафайли", "answer": "Короткострокові посилання на медіафайли були **ненадійними**. Тому автор інтегрував **ImageKit**, який дає **стабільні CDN-посилання**, і зображення публікуються без збоїв через непридатні лінки.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Content-Factory-Instagram-API-Error-9007-16b88deb8fea83a4b1208199fa35756a"}, {"faq": "E9", "question": "Чому автор відмовився від нативного Instagram-модуля в Make?", "query": "Content Factory: нативний модуль Instagram, HTTP, контейнер IN_PROGRESS, FINISHED, 10 спроб, 30 секунд", "answer": "Нативний модуль публікував контент **завчасно**, коли Meta ще не завершила обробку медіафайлу (контейнер у статусі IN_PROGRESS), і виникала помилка 9007. Автор замінив його на **HTTP-модулі Instagram Graph API**: створення контейнера, **10 повторних перевірок статусу кожні 30 секунд** і фінальна публікація **лише коли статус FINISHED**.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Content-Factory-Instagram-API-Error-9007-16b88deb8fea83a4b1208199fa35756a"}, {"faq": "E10", "question": "Який результат дав Content Factory після виправлення?", "query": "Content Factory: результат, стабільна публікація, цифри, аналітика Google Sheets, надійність", "answer": "Після виправлення помилки 9007 **публікація працює стабільно**. Конкретних цифр автор не наводить, а мета «100% надійність» лишається метою, а не досягнутим числом. Усі дані про публікації й статуси записувались у Google Sheets для аналітики.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Content-Factory-Instagram-API-Error-9007-16b88deb8fea83a4b1208199fa35756a"}, {"faq": "F1", "question": "Розкажи про AI Telegram Assistant для магазину", "query": "AI Telegram Assistant: двосценарний бот з CRM у Make", "answer": "**AI Telegram Assistant** (Make) має два сценарії. Перший відповідає клієнтам готовими відповідями з Google Sheets (без AI-генерації, щоб інформація про товар була точною) і передає складні запити далі. Другий веде облік: перевіряє, чи клієнт новий, оновлює або створює запис у CRM-таблиці й сповіщає менеджера в Telegram. За оцінкою самого власника, його розвантажено на 50-60%.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Telegram-Assistant-CRM-5c788deb8fea8373a6a4015f74cb01b5"}, {"faq": "F2", "question": "Чи працює AI Telegram Assistant зараз?", "query": "AI Telegram Assistant: чи працює зараз, статус, використання", "answer": "Це був **фріланс-проєкт для власника нішевого магазину**. Чи працює бот зараз і чи магазин ним користується, автор не знає, тому це не стверджується. Те, що відомо точно, описано на сторінці проєкту: бот брав на себе первинні відповіді та облік клієнтів, а власник оцінив своє розвантаження на 50-60%.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Telegram-Assistant-CRM-5c788deb8fea8373a6a4015f74cb01b5"}, {"faq": "F3", "question": "Скільки коштувало створити і запустити AI Telegram Assistant?", "query": "AI Telegram Assistant: вартість, ціна, тариф Make, бюджет, скільки коштувало", "answer": "Проєкт був навмисно **дешевим і простим**. Make працював на тарифі **Core, близько $9 на місяць за акаунт** при оплаті за рік, акаунтів було два: $216 на рік за тарифом і приблизно **$250 на рік** разом з комісіями банку при оплаті. Google Sheets і Telegram безкоштовні, тож власник заплатив за платформу один раз на рік. Цифри з пам'яті автора.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Telegram-Assistant-CRM-5c788deb8fea8373a6a4015f74cb01b5"}, {"faq": "F4", "question": "Який був обсяг у AI Telegram Assistant і чому два акаунти Make?", "query": "AI Telegram Assistant: обсяг, потік клієнтів, ліміти Make, два акаунти, навантаження", "answer": "Клієнтів було багато: більшість писала власнику прямо в Telegram, а він записував усе від руки. Потік був великий, тому **в ліміти безкоштовного тарифу Make не вкладались** (безкоштовних 1000 кредитів тоді ще не було). Рішення: **два сценарії розвели на два акаунти Make** і оплатили їх на рік, щоб вийшло дешевше. Точну кількість запитів на день автор не називав, тому її тут немає.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Telegram-Assistant-CRM-5c788deb8fea8373a6a4015f74cb01b5"}, {"faq": "F5", "question": "Чому AI Telegram Assistant не генерує відповіді через AI?", "query": "AI Telegram Assistant: чому без AI, таблиці, готові відповіді, нішевий товар", "answer": "Бо AI там **не був потрібен**. Магазин нішевий, клієнти постійні, тож вистачило таблиць Google Sheets із цінами, назвами товарів та іншими готовими відповідями. Їх внесли разом із власником приблизно за пів вечора, а автор показав власнику, як редагувати таблицю самому з телефону. Це ще й гарантує точність: бот не вигадає ціни чи наявності. Google Sheets і Telegram безкоштовні, тому рішення вийшло дешевим.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Telegram-Assistant-CRM-5c788deb8fea8373a6a4015f74cb01b5"}, {"faq": "F6", "question": "Звідки взялась цифра розвантаження 50-60% в AI Telegram Assistant?", "query": "AI Telegram Assistant: 50-60%, розвантаження, як виміряно, результат власника", "answer": "Це **оцінка самого власника**, а не точний замір. Він перестав усе записувати в блокнот, замовлення й дані клієнтів (нік, ім'я, адреса, телефон) потрапляли в таблицю й бот автоматично, а номер телефону копіювався одним натиском, щоб одразу подзвонити. Власник телефоном сказав, що в нього з'явився час, і оцінив розвантаження на 50-60%. Строгих замірів не було, тому це подається як відгук клієнта.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Telegram-Assistant-CRM-5c788deb8fea8373a6a4015f74cb01b5"}, {"faq": "F7", "question": "Що робить AI Telegram Assistant, якщо питання немає в таблиці?", "query": "AI Telegram Assistant: нестандартне питання, чого немає в таблиці, передача менеджеру, дзвінок", "answer": "Бот **не вигадує відповідь**. Якщо питання нестандартне і його немає в таблиці, клієнту він повідомляє, що з ним зв'яжуться, а власник отримує в Telegram повідомлення з **номером телефону** клієнта й позначкою про нестандартний запит. Власник **передзвонює сам**. Так складні випадки лишаються за людиною, а типові закриваються автоматично.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Telegram-Assistant-CRM-5c788deb8fea8373a6a4015f74cb01b5"}, {"faq": "F8", "question": "Чи використовував автор AI Telegram Assistant у навчанні й чи є відгук?", "query": "AI Telegram Assistant: курс AI в маркетингу та продажах, домашня робота, експертна оцінка", "answer": "Так. Спочатку це була **реальна автоматизація для власника магазину**. Потім автор адаптував її як одну з домашніх робіт курсу **«AI в маркетингу та продажах» (Eastern Ukraine EDIH, Promodo Academy, Kharkiv IT Cluster)** і прямо вказав, що бере за шаблон власну автоматизацію. **Відгуку по цій роботі автор ще чекає**, тому експертного підтвердження по цьому проєкту поки немає.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Telegram-Assistant-CRM-5c788deb8fea8373a6a4015f74cb01b5"}, {"faq": "F9", "question": "Які інструменти використано в AI Telegram Assistant?", "query": "AI Telegram Assistant: стек, Make, Telegram Bot, Google Sheets, HTTP Request, Webhooks", "answer": "**Make** (два сценарії на двох акаунтах), **Telegram Bot** (Watch Updates і Send Messages), **Google Sheets** (чотири окремі таблиці: база знань, фіксація, облік і CRM) та **HTTP Request і Webhooks** для зв'язку між сценаріями. AI-генерації відповідей там немає.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Telegram-Assistant-CRM-5c788deb8fea8373a6a4015f74cb01b5"}, {"faq": "F10", "question": "Як у AI Telegram Assistant працює CRM-облік?", "query": "AI Telegram Assistant: CRM, облік клієнтів, webhook, новий клієнт, таблиця, сповіщення менеджеру", "answer": "Другий сценарій приймає дані через **webhook** від першого. Він перевіряє в CRM-таблиці, чи клієнт **новий**: якщо існуючий, оновлює рядок, якщо новий, створює запис. Менеджер отримує сповіщення в Telegram лише про нестандартні запити або готові до обробки замовлення. Так автор перевів власника від ручного запису в зошиті до автоматизованої бази продажів.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Telegram-Assistant-CRM-5c788deb8fea8373a6a4015f74cb01b5"}, {"faq": "G1", "question": "Розкажи про AI Instagram Assistant", "query": "AI Instagram Assistant: коментарі й Direct, Make і ManyChat", "answer": "**AI Instagram Assistant** — гібридна система для Instagram-магазину. У коментарях Make і OpenAI фільтрують спам і класифікують запит за шкалою 0-4, відповідь береться з таблиці. У Direct ManyChat з OpenAI веде діалог і передає менеджеру лише гарячі заявки. Є модуль «ШІ-тімлід» для аналізу історії комунікації. За вимірами автора, економія до 40-50% часу менеджера.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G2", "question": "Чи був AI Instagram Assistant реальним проєктом чи навчальним кейсом?", "query": "AI Instagram Assistant: реальний чи навчальний, курс AI в маркетингу та продажах, експертна оцінка", "answer": "Це **реальна автоматизація, пов'язана з продажами**, а не вигаданий кейс. Автор адаптував її як домашню роботу курсу **«AI в маркетингу та продажах» (Eastern Ukraine EDIH, Promodo Academy, Kharkiv IT Cluster)** разом з проєктами AI Lead Scoring та AI Telegram Assistant і прямо вказав у роботі, що використовує власну автоматизацію як шаблон. Роботу затвердили на платформі курсу з відгуком експерта, про який розповідає відповідь G3.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G3", "question": "Що експерт курсу сказав про AI Instagram Assistant?", "query": "AI Instagram Assistant: відгук експерта, затверджено, рекомендації, fallback, рефлексія", "answer": "Домашню роботу з проєкту AI Instagram Assistant **затверджено** на платформі курсу, і експерт переглянув її із задоволенням. Він відзначив **розбір слабкого місця воронки** за моделлю «вхід, обробка, вихід», правильно сформульований промпт для ШІ-тімліда та **гібридну архітектуру** Make + ManyChat + OpenAI, яка знімає рутину з менеджера. Експерт дав і дві рекомендації: додати **особисту рефлексію** (порівняти пораду ШІ-тімліда з реальними діями автора) і **протестувати fallback**, наприклад сигнал у Telegram, якщо менеджер не підключився до гарячого ліда за 5 хвилин. Це зони росту, які автор має намір врахувати.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G4", "question": "Як працює канал коментарів в AI Instagram Assistant?", "query": "AI Instagram Assistant: коментарі, Make, OpenAI, категорії 0-4, спам, таблиця відповідей", "answer": "Коментарі обробляє **Make + OpenAI**. Instagram-тригер ловить кожен новий коментар. Далі два фільтри відсікають коментарі власного бота та спам. Потім AI за детальним промптом класифікує коментар за категоріями від **0 (спам, ігнорувати) до 4 (замовлення)**, де між ними доставка, оплата й розмір. Для категорій 1-4 система бере готову коротку відповідь із **першої таблиці Google Sheets** (там і посилання на тарифи та інструкції) і публікує її в коментарях, в ідеалі переводячи людину в Direct. **Друга таблиця** веде облік усіх звернень для звітності.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G5", "question": "Як працює Direct в AI Instagram Assistant і чому там ManyChat?", "query": "AI Instagram Assistant: Direct, ManyChat, OpenAI, кваліфікація, передача менеджеру, гібрид з Make", "answer": "У Direct діалог ведуть **ManyChat і Make разом з OpenAI**: ManyChat приймає повідомлення й відправляє відповідь, а AI-відповідь формує окремий сценарій Make через OpenAI. Коли ManyChat виявляє «гарячий» інтерес, він за умовою передає заявку живому менеджеру. Make тримає загальну логіку, базу знань і звітність, а ManyChat відповідає за бесіду в Direct і доставку відповіді.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G6", "question": "Яке слабке місце воронки розв'язує AI Instagram Assistant?", "query": "AI Instagram Assistant: слабке місце воронки, втрата клієнтів, коментарі, затримка відповіді", "answer": "У воронці Instagram-магазину п'ять етапів: перший контакт, фільтрація й первинна відповідь, кваліфікація в Direct, передача гарячого ліда менеджеру, оплата. **Слабким місцем** автор визначив другий етап: менеджер вручну переглядав кожен коментар, видаляв спам і шукав у таблицях шаблони відповідей («Яка вартість?», «Чи є розмір M?»). Відповідь приходила з **затримкою від 30 хвилин до кількох годин**, особливо в неробочий час чи при великому потоці, і клієнти йшли до конкурентів або губилися серед спаму.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G7", "question": "Що таке модуль «ШІ-тімлід» в AI Instagram Assistant?", "query": "AI Instagram Assistant: ШІ-тімлід, промпт, аналіз історії переписки, рекомендація, чернетка", "answer": "«ШІ-тімлід» це модуль, який аналізує історію спілкування з клієнтом (листи, повідомлення, нотатки після дзвінків із датами) у ролі досвідченого керівника відділу продажів. Відповідь має **чотири блоки**: ситуація (на чиєму боці ініціатива), рекомендація (написати зараз, відкласти чи закрити як програну, з поясненням), коли саме наступний контакт і чому, та чернетка короткого повідомлення без тиску. Важливе правило промпта: **якщо даних бракує, не вигадувати, а вказати, чого не вистачає**. Приклад на сторінці: клієнт запитав про розмір і замовк після відповіді менеджера, і ШІ-тімлід вибудовує стратегію повернення його у воронку.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G8", "question": "Як AI Instagram Assistant борониться від спаму?", "query": "AI Instagram Assistant: спам, двоетапна фільтрація, категорія 0, коментарі бота", "answer": "Спам відсікається у **два етапи**. Спочатку фільтри Make прибирають коментарі власного бота й очевидний спам. Потім AI-скоринг присвоює категорію **0 (спам, ігнорувати)** тим, що пройшли фільтри. Завдяки цьому менеджер не витрачає час на ручний перегляд і видалення спаму, а власник магазину оцінив економію часу менеджера до 40-50%.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G9", "question": "Яка користь від AI Instagram Assistant для бізнесу?", "query": "AI Instagram Assistant: користь, результати, 24/7, економія часу менеджера, пріоритезація", "answer": "Автор називає п'ять переваг: **двоетапна фільтрація спаму**, **робота 24/7** (миттєва реакція й у неробочий час), **AI-пріоритезація** запитів (замовлення, розмір, доставка), **гібридна архітектура** Make + ManyChat і **чисті дані** завдяки двом таблицям (база знань і звітність). Економію до 40-50% часу менеджера назвав сам власник магазину, це його оцінка, а не окремий замір.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G10", "question": "Які інструменти використано в AI Instagram Assistant?", "query": "AI Instagram Assistant: стек, Make, ManyChat, OpenAI, Google Sheets, Instagram for Business", "answer": "**Make** (логіка, бази даних, звітність), **OpenAI** (GPT-моделі для класифікації коментарів і ведення діалогу), **ManyChat** (бесіди в Direct), **Google Sheets** (база знань і звітність) та **Instagram for Business** як канал. Кастомного коду не потрібно, це no-code система.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G11", "question": "Що автор покращив би в AI Instagram Assistant?", "query": "AI Instagram Assistant: що покращити, fallback, рекомендації експерта, рефлексія", "answer": "Автор орієнтується на **рекомендації експерта курсу**: протестувати **fallback-механізм** (наприклад, автоматичний сигнал у Telegram, якщо менеджер не підключився до гарячого ліда за 5 хвилин) і додати **власну рефлексію**, порівнявши пораду ШІ-тімліда з реальними діями. Не стверджується, що fallback уже реалізовано: це наступний крок.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G12", "question": "Чи розробляв автор AI Instagram Assistant сам, і яка була його роль?", "query": "AI Instagram Assistant: сам чи в команді, у парі, співавтор, командна робота", "answer": "Ні, це **єдиний проєкт, який автор робив у парі**. Замовлення було його знайомої, терміни горіли, і він прийшов допомогти. Роботу розділили за інструментами: **автор робив частину на Make** (канал коментарів, логіка, таблиці), а **вона частину на ManyChat** (Direct). Вона й веде проєкт далі. Це досвід спільної роботи в парі, але не робота в команді компанії, тому командного комерційного досвіду автор не заявляє.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G13", "question": "Чи працює AI Instagram Assistant зараз?", "query": "AI Instagram Assistant: чи працює зараз, статус, використання, два роки", "answer": "Автор не знає. Минуло вже понад рік, а систему веде далі його напарниця по проєкту, тож актуального стану він не знає і не стверджує, що вона працює. На сторінці проєкту описано, як система була влаштована й що показала робота.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G14", "question": "Скільки коштував AI Instagram Assistant у роботі?", "query": "AI Instagram Assistant: вартість, тариф Make, ManyChat безкоштовно, Ukrainian Relief Program", "answer": "Це був реальний інтернет-магазин із **великим потоком звернень**, а витрати були невеликі. **Make** працював на тарифі **Core за $9 на місяць** при оплаті за рік. **ManyChat** використовувався безкоштовно: за програмою **Ukrainian Relief Program** українці отримували тариф Pro без оплати. Програма стартувала 1 березня 2022 року й кілька разів продовжувалась, а її офіційний загальнодоступний термін, за даними автора, спливав 30 червня 2026 року. Точної кількості звернень автор не називає.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G15", "question": "Звідки взялась класифікація спаму в AI Instagram Assistant і звідки цифра 40-50%?", "query": "AI Instagram Assistant: класифікація спаму, ідея, 40-50%, власник, гарячі ліди, менеджер", "answer": "Магазин засипали спамом, тому **класифікацію запропонував і впровадив автор** за допомогою OpenAI (ChatGPT) і таблиць. Коли це запрацювало, **власник сам назвав цифру 40-50% економії часу** і був задоволений, бо отримував лише гарячих лідів і не відривав постійно свого менеджера. Команда продажів була мінімальною: один менеджер і сам власник, тож для них це було дуже важливо. Це оцінка власника, а не окремий замір.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G16", "question": "Яку AI-модель використовує AI Instagram Assistant для коментарів?", "query": "AI Instagram Assistant: модель, GPT-3.5 Turbo, OpenAI, Make, класифікація коментарів", "answer": "Для класифікації коментарів у Make автор використав **OpenAI gpt-3.5-turbo** (метод Chat Completion). На той час вона була ефективною для цієї задачі. Сценарій такий: Instagram бере новий коментар, фільтр відсікає зайве, OpenAI повертає цифру-категорію, результат записується в Google Sheets, потім коротка пауза і публікація відповіді в коментарі.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G17", "question": "За якими критеріями AI Instagram Assistant класифікує коментарі?", "query": "AI Instagram Assistant: критерії 0-4, промпт, спам, доставка, оплата, розмір, замовлення", "answer": "Промпт просить AI відповісти **лише цифрою**. Категорії: **1 доставка** (терміни, коли привезуть), **2 оплата** (картка, накладений платіж), **3 розмір** (які є розміри), **4 замовлення** (як купити чи оформити). Цифра **0 означає ігнорувати**: спам і реклама, образливі слова, беззмістовний текст, прості відповіді клієнтів на кшталт «дякую» чи «ок», і будь-які повідомлення без чіткого питання. Ключові слова задано трьома мовами (українська, російська, англійська). Для категорій 1-4 система бере готову відповідь із таблиці. Точний текст промпта тут не наводиться.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G18", "question": "Як AI Instagram Assistant гарантує, що жоден коментар не загубиться?", "query": "AI Instagram Assistant: Comment ID, звірка, таблиці, фільтри, перестраховка, архітектура", "answer": "Кожному коментарю присвоюється **Comment ID**, і система звіряє все за ним, щоб жоден коментар не проскочив випадково. У звітній таблиці зберігаються ID, текст, категорія 0-4, юзернейм і час. Фільтри Make стоять на всякий випадок: це улюблений підхід автора, **відсіювати й перестраховуватися дешевими та ефективними методами**, а не покладатися лише на AI. Окремо є таблиця бази знань із темами, ключовими словами й готовими відповідями та посиланнями.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G19", "question": "Як у AI Instagram Assistant влаштований Direct?", "query": "AI Instagram Assistant: Direct, ManyChat, Smart Delay, gpt_reply, Make, сценарій", "answer": "Direct працює на **двох сценаріях разом**. У ManyChat (цю частину робила напарниця) користувач пише в Direct, текст зберігається в полі й запускається окремий сценарій у Make: він приймає дані з ManyChat, формує відповідь через OpenAI (промпт менеджера з продажу, що обробляє клієнтські повідомлення) і записує її в поле `gpt_reply`. ManyChat чекає **Smart Delay 55 секунд**, щоб Make встиг відпрацювати, і лише тоді надсилає відповідь клієнту й очищає поле. Пауза потрібна для синхронізації сценаріїв.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "G20", "question": "Наскільки складною була архітектура AI Instagram Assistant?", "query": "AI Instagram Assistant: складність, три сценарії, гібрид, Make, ManyChat, короткі терміни", "answer": "Це була **важка гібридна система з трьох сценаріїв**: сценарій Make для коментарів (Instagram, OpenAI, таблиці, пауза, відповідь), сценарій Make для Direct (OpenAI формує відповідь і записує її в поле ManyChat) і сценарій у ManyChat, який приймає повідомлення, чекає й надсилає відповідь. Їх потрібно було синхронізувати паузами, а ще вкластися в **стислі терміни** разом із колегою. Автор відповідав за частину на Make, а колега за ManyChat.\n\nДокладніше: https://capricious-ball-d4c.notion.site/MarTech-AI-Instagram-Assistant-Direkt-b6488deb8fea8393a7e38141770ac54f"}, {"faq": "H1", "question": "Як згенерувати 30-секундне відео на 8 GB VRAM (LTX-2.3)?", "query": "LTX-2.3: 30-секундне відео локально на 8 GB VRAM", "answer": "У проєкті **LTX-2.3** локальний ComfyUI-workflow генерує 30-секундне cinematic-відео на ноутбуку з RTX 5050 8 GB і 32 GB RAM. Ключове: GGUF-квантизація, low-VRAM режим, асинхронне вивантаження ваг, розбиття FeedForward на 4 частини, кеші CacheDiT (≈25% прискорення за вимірами автора) і TeaCache (5-15%), ланцюг із трьох LoRA. Час близько 16-18 хвилин на ролик.\n\nДокладніше: https://capricious-ball-d4c.notion.site/LTX-2-3-sm_120-Optimization-30s-Multi-LoRA-Cinematic-on-8GB-VRAM-Text-to-Video-37088deb8fea80ad92eaca27469bca69"}, {"faq": "H2", "question": "Чому автор узявся за 30-секундне відео на 8 GB і як почав з ComfyUI?", "query": "LTX ComfyUI: мотивація, чому ComfyUI, самонавчання, вакансія trainee, n8n досвід", "answer": "Автор відгукнувся на вакансію, пов'язану з ComfyUI, на позицію trainee і не отримав відповіді, тож вирішив **розібратися сам**. На чотири проєкти ComfyUI пішло близько **4-5 місяців**. Допоміг досвід n8n: ноди, кастомні ноди й логіка графів були знайомі, тому він швидко зрозумів ComfyUI. Проєкт із LTX це спроба вмістити 30-секундний ролик у ноутбучні 8 GB VRAM.\n\nДокладніше: https://capricious-ball-d4c.notion.site/LTX-2-3-sm_120-Optimization-30s-Multi-LoRA-Cinematic-on-8GB-VRAM-Text-to-Video-37088deb8fea80ad92eaca27469bca69"}, {"faq": "H3", "question": "Чому саме 8 GB VRAM і чому 30 секунд у проєкті з LTX?", "query": "LTX-2.3: чому 8 GB VRAM, 30 секунд, ноутбук RTX 5050, Blackwell sm_120, CUDA, Triton, три ComfyUI", "answer": "**8 GB це власний ноутбук автора** з RTX 5050, тому він працював локально з тим залізом, що було. Почав з драйверів і CUDA. Спочатку були бібліотеки Triton, а потім NVIDIA випустила підтримку **Blackwell sm_120** для GeForce, і автор переробив усе під свою карту. Тому на ноутбуці зараз **три встановлення ComfyUI** (основне, BETA і TEST): інструменти змінювалися швидко, і автор проходив цю еволюцію разом із ними. **30 секунд** він обрав свідомо: на такому залізі це складно, але можливо, а автор береться за найважчі задачі. Отримати 30-секундне відео з LTX-2.3 одним текстовим промптом за один прохід без видимих артефактів було його метою, і вона досягнута, хоча «без артефактів» це оцінка автора.\n\nДокладніше: https://capricious-ball-d4c.notion.site/LTX-2-3-sm_120-Optimization-30s-Multi-LoRA-Cinematic-on-8GB-VRAM-Text-to-Video-37088deb8fea80ad92eaca27469bca69"}, {"faq": "H4", "question": "Автор будував LTX-workflow з нуля чи брав готовий шаблон?", "query": "LTX ComfyUI: готовий шаблон, з нуля, перебудував, open source, workflow", "answer": "Автор взяв **стандартний готовий шаблон** ComfyUI і **повністю перебудував** його під своє залізо та задачу. У open source це звичайна практика: стандартний шаблон є завжди, а далі кожен допрацьовує його під себе різними можливостями та за допомогою ШІ. Він не стверджує, що писав усе з нуля.\n\nДокладніше: https://capricious-ball-d4c.notion.site/LTX-2-3-sm_120-Optimization-30s-Multi-LoRA-Cinematic-on-8GB-VRAM-Text-to-Video-37088deb8fea80ad92eaca27469bca69"}, {"faq": "H5", "question": "Яка була найважча проблема в проєкті з LTX і як автор її розв'язав?", "query": "LTX ComfyUI: найважча проблема, артефакти, морфінг рук, LoRA, негативний промпт, якість руху", "answer": "**Пам'ять** автор розв'язав кастомними нодами й оптимізацією. Найважчим було змусити модель зробити відео **без артефактів** у складних сценах із двома персонажами: рух ставав нестабільним, а геометрія рук і тіл «зливалася». Це розв'язувалося трьома способами:\n\n- **Промпт-інжиніринг** за структурою «сцена, взаємодія, фізика й світло, кінематографічні опори» з чіткими описами кожної фази, що фіксують анатомію.\n- **Негативний промпт понад 110 токенів** у п'яти кластерах: анатомія, нестабільність руху, артефакти переходів, прикраси, витік звуку.\n- **Три LoRA** через Power Lora Loader: структурна для двох персонажів (0.60), кінематика й плавність руху (0.60) і різкість мікродеталей (0.40).\n\nВ описі автор зазначив стабільну генерацію всіх 721 кадру з чистою анатомією в межах 8 GB VRAM, але «повністю усунуло» це його оцінка.\n\nДокладніше: https://capricious-ball-d4c.notion.site/LTX-2-3-sm_120-Optimization-30s-Multi-LoRA-Cinematic-on-8GB-VRAM-Text-to-Video-37088deb8fea80ad92eaca27469bca69"}, {"faq": "H6", "question": "Що автор пробував і відкидав у проєкті з LTX?", "query": "LTX ComfyUI: що пробував, відкинув, експерименти, open source, нові інструменти", "answer": "Автор **перепробував усе, що було доступне на той час**. ComfyUI це open source, де щохвилини хтось робить щось нове, тому доводилося постійно тестувати нові ноди й підходи та залишати лише те, що реально працює на його 8 GB. Конкретні відкинуті рішення тут не перелічені.\n\nДокладніше: https://capricious-ball-d4c.notion.site/LTX-2-3-sm_120-Optimization-30s-Multi-LoRA-Cinematic-on-8GB-VRAM-Text-to-Video-37088deb8fea80ad92eaca27469bca69"}, {"faq": "H7", "question": "Де на практиці корисне вміння генерувати відео локально й дешево?", "query": "локальна генерація відео: практичне застосування, ComfyUI n8n гібрид, MiniMax H3, ідея", "answer": "Автор побачив у цьому можливість зробити **гібридну автоматизацію ComfyUI + n8n**, де все працює локально: від запуску сценарію до виробництва відео, без платних SaaS. Поки це лише **ідея**: він її ще не реалізував, бо постійно вчиться чи робить інші проєкти. Йому особливо сподобався **MiniMax H3**, який добре слухається промпта, і після трьох проєктів у ComfyUI він зробив на ньому ще один (Seed-Funnel). Ці чотири проєкти він називає **Independent Projects**. Після цього він отримав фріланс-замовлення і взявся за AI Scout Agent у n8n.\n\nДокладніше: https://capricious-ball-d4c.notion.site/LTX-2-3-sm_120-Optimization-30s-Multi-LoRA-Cinematic-on-8GB-VRAM-Text-to-Video-37088deb8fea80ad92eaca27469bca69"}, {"faq": "H8", "question": "Які оптимізації автор застосував у LTX-проєкті?", "query": "LTX 8 GB: оптимізації, GGUF, SageAttention, CacheDiT, TeaCache, lowvram, FeedForward, Blackwell", "answer": "Автор інтегрував **GGUF-квантизацію** (Q4_K_M), **SageAttention**, **CacheDiT**, **TeaCache** і low-VRAM керування пам'яттю: режим `-lowvram`, асинхронне вивантаження ваг у 2 потоки з pinned memory та розбиття обчислення FeedForward на 4 частини. Для Blackwell sm_120 потрібен перехід від Triton до CUDA-native реалізацій attention. За замірами автора CacheDiT дає приблизно 25% прискорення, TeaCache 5-15%, а порядок їх застосування важливий.\n\nДокладніше: https://capricious-ball-d4c.notion.site/LTX-2-3-sm_120-Optimization-30s-Multi-LoRA-Cinematic-on-8GB-VRAM-Text-to-Video-37088deb8fea80ad92eaca27469bca69"}, {"faq": "H9", "question": "На якому залізі й з яким результатом працює LTX-проєкт?", "query": "LTX 8 GB: середовище, RTX 5050, 32 GB RAM, ComfyUI, час генерації 16-18 хвилин, 721 кадр", "answer": "Залізо: ноутбук з **RTX 5050 8 GB**, Intel i5-13450HX і **32 GB RAM**. Середовище: ComfyUI v0.22.0, CUDA 13.0, PyTorch 2.9.1, Python 3.12.10, модель LTX-2.3 22B (GGUF Q4_K_M). Результат: стабільний час генерації 30-секундного ролика **близько 16-18 хвилин** (на показаному прикладі 16,27 хв, 721 кадр) без переходу на платні SaaS.\n\nДокладніше: https://capricious-ball-d4c.notion.site/LTX-2-3-sm_120-Optimization-30s-Multi-LoRA-Cinematic-on-8GB-VRAM-Text-to-Video-37088deb8fea80ad92eaca27469bca69"}, {"faq": "H10", "question": "Де після оптимізації лишилась основна складність у LTX-проєкті?", "query": "LTX 8 GB: складність, prompt engineering, режисура, стабільність заліза", "answer": "Після оптимізації основна складність змістилась **з апаратної стабільності на prompt engineering і режисуру складних сцен**. Пам'ять і вильоти автор закрив оптимізаціями, а от чиста анатомія й стабільний рух у сцені з двома персонажами потребували структурованого промпта, негативного промпта й ланцюга з трьох LoRA.\n\nДокладніше: https://capricious-ball-d4c.notion.site/LTX-2-3-sm_120-Optimization-30s-Multi-LoRA-Cinematic-on-8GB-VRAM-Text-to-Video-37088deb8fea80ad92eaca27469bca69"}, {"faq": "I1", "question": "Розкажи про пайплайн апскейлу відео до 4K", "query": "AI Video Upscale Pipeline: апскейл відео до 4K на 8 GB VRAM", "answer": "**AI Video Upscale Pipeline** — трьоступеневий каскад у ComfyUI на 8 GB VRAM: 1) автоматичне зчитування метаданих і розрахунок масштабу, 2) генеративний апскейл SeedVR2 (GGUF Q8_0, основна модель 3B) з вивантаженням блоків у RAM, 3) апаратний апскейл NVIDIA RTX VSR до 4K. Автор порівняв сім open-source апскейлерів власними тестами. У його тестах пайплайн працює від 424×234 до 4K без збоїв пам'яті.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Video-Upscale-Pipeline-3-Stage-Cascade-on-8GB-VRAM-37088deb8fea80089187d040a6a64cc2"}, {"faq": "I2", "question": "Як і чому автор зробив пайплайн апскейлу відео?", "query": "Video Upscale: як почав, мотивація, ComfyUI, 8 GB, самонавчання, контекст серії", "answer": "Це один з чотирьох **Independent Projects у ComfyUI**, які автор зробив приблизно за **4-5 місяців** локально на власному ноутбуці з **8 GB VRAM** (RTX 5050). Він відгукнувся на вакансію з ComfyUI на позицію trainee, відповіді не було, і він вирішив розібратися сам; допоміг досвід n8n, де вже були ноди й кастомні ноди. Автор брав стандартні шаблони й перебудовував їх, перепробовуючи багато нового. Після цього він отримав фріланс-замовлення і взявся за AI Scout Agent у n8n.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Video-Upscale-Pipeline-3-Stage-Cascade-on-8GB-VRAM-37088deb8fea80089187d040a6a64cc2"}, {"faq": "I3", "question": "Чому пайплайн апскейлу зроблено каскадом із кількох ступенів?", "query": "Video Upscale: чому каскад, слабке залізо, 8 GB, ноди очищення пам'яті, out of memory, складна архітектура", "answer": "Бо ноутбук автора **ігровий і не розрахований на рендер відео**, а працювати доводилося на мінімумі: RTX 5050 Laptop з 8 GB VRAM і 32 GB RAM. Тому автор підбирав лише те, що працює на слабкому залізі, і збудував **каскад**: відео обробляється поступово, а **між ступенями стоять кастомні ноди оптимізації**, які чистять пам'ять і не дають вилетіти в out-of-memory. Є й друга причина: кожен апскейлер має свої плюси й мінуси, тому каскад поєднує їхні сильні сторони. Архітектура вийшла складною, але в open source завжди можна взяти чиюсь фічу й вбудувати у свій воркфлоу. Ці проєкти дали автору поштовх рухатись далі, зокрема шукати роботу, бо поєднання n8n, Make, ComfyUI і реальних MarTech-задач він вважає сильною стороною.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Video-Upscale-Pipeline-3-Stage-Cascade-on-8GB-VRAM-37088deb8fea80089187d040a6a64cc2"}, {"faq": "I4", "question": "Що здивувало автора, коли він порівнював апскейлери?", "query": "Video Upscale: порівняння апскейлерів, що здивувало, артефакти, SeedVR2, RTX VSR", "answer": "Найбільше автора здивувало, що у **кожного апскейлера свої, різні артефакти**. Кожен має свої плюси й мінуси, тому ступені каскаду поєднують сильні сторони різних інструментів. Він тестував NVIDIA RTX VSR, SeedVR2, CodeFormer, FlashVSR, Ultimate SD Upscale та інші, а таблиця порівняння є на сторінці проєкту.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Video-Upscale-Pipeline-3-Stage-Cascade-on-8GB-VRAM-37088deb8fea80089187d040a6a64cc2"}, {"faq": "I5", "question": "Що було найтяжчим у пайплайні апскейлу відео?", "query": "Video Upscale: найтяжче, OOM, флікер, артефакти, таблиця порівнянь, каскад", "answer": "Найтяжче було **оптимізувати все так, щоб не вилетіти в out-of-memory**. Окрім цього, були проблеми з **флікером (мерехтінням)** і різними артефактами, тому автор вів **власну таблицю записів і порівнянь**, щоб знайти те, що шукав. Тоді все це закрив саме **трьоступеневий каскадний апскейлер**. Чи це найкраще рішення сьогодні, не стверджується: інструменти швидко змінюються.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Video-Upscale-Pipeline-3-Stage-Cascade-on-8GB-VRAM-37088deb8fea80089187d040a6a64cc2"}, {"faq": "I6", "question": "Скільки часу займає апскейл відео в пайплайні автора?", "query": "Video Upscale: час обробки, скільки часу, швидкість, залежить від відео", "answer": "Єдиного числа нема: **час залежить від самого відео, його довжини та стану вхідного матеріалу**. Пайплайн підлаштовується під будь-який вхід, зчитуючи тривалість, FPS і розмір, а на показаному на сторінці прикладі ціль оптимізації була понад 750 кадрів. Точні цифри залежать від конкретного ролика.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Video-Upscale-Pipeline-3-Stage-Cascade-on-8GB-VRAM-37088deb8fea80089187d040a6a64cc2"}, {"faq": "I7", "question": "На яких відео автор тестував апскейл?", "query": "Video Upscale: вхідні відео, що апскейлив, власні ролики, з інтернету, тестові", "answer": "Автор тестував на **різних роликах**: і на власних, і на тих, що взяті з інтернету, під різні задачі. Це важливо, бо стан вхідного відео сильно впливає на результат і на час обробки. Приклад на сторінці проєкту йде від 424×234 до 4K.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Video-Upscale-Pipeline-3-Stage-Cascade-on-8GB-VRAM-37088deb8fea80089187d040a6a64cc2"}, {"faq": "I8", "question": "Які апскейлери автор порівнював і чому деякі виключив?", "query": "Video Upscale: порівняння, RTX VSR, SeedVR2, CodeFormer, FlashVSR, Ultimate SD Upscale, 4x-UltraSharp, Remacri", "answer": "Автор власноруч протестував open-source апскейлери: **NVIDIA RTX VSR, SeedVR2, CodeFormer, FlashVSR, Ultimate SD Upscale, 4x-UltraSharp і 4x-foolhardy-Remacri**. Критерії в таблиці: вартість, мінімальний VRAM, тип обробки, темпоральна стабільність, якість текстур, швидкість, артефакти й роль у пайплайні. **CodeFormer, Ultimate SD Upscale, FlashVSR і 4x-UltraSharp** він виключив, причини вказані на сторінці проєкту.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Video-Upscale-Pipeline-3-Stage-Cascade-on-8GB-VRAM-37088deb8fea80089187d040a6a64cc2"}, {"faq": "I9", "question": "Які три ступені має каскад апскейлу?", "query": "Video Upscale: три ступені каскаду, підготовка, SeedVR2, RTX VSR, 4K", "answer": "1) **Підготовка:** пайплайн автоматично зчитує метадані відео (тривалість, FPS, розмір) і рахує кількість кадрів та коефіцієнт масштабування, щоб підлаштовуватися під будь-який вхід і не переповнювати пам'ять. 2) **Генеративний апскейл:** SeedVR2 (GGUF Q8_0, основна модель 3B, версію 7B автор теж пробував, але 3B легша) з вивантаженням блоків у RAM, тайловим VAE, нормалізацією розміру й кольорокорекцією, далі м'яка різкість і плівкове зерно. 3) **Апаратний апскейл до 4K:** NVIDIA RTX Video Super Resolution на Tensor Cores як фінальний крок.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Video-Upscale-Pipeline-3-Stage-Cascade-on-8GB-VRAM-37088deb8fea80089187d040a6a64cc2"}, {"faq": "I10", "question": "Який результат дає пайплайн апскейлу?", "query": "Video Upscale: результат, 4K, H.265 10-bit, 424x234, аудіо, 750 кадрів, без збоїв пам'яті", "answer": "Повністю **локальний універсальний пайплайн** обробляє відео каскадом на 8 GB VRAM: від **424×234 до 4K H.265 10-bit** з органічною текстурою та збереженим аудіо. Ціль оптимізації була понад **750 кадрів**. У тестах автора без збоїв пам'яті, але це не узагальнюється на всі можливі вхідні файли.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Video-Upscale-Pipeline-3-Stage-Cascade-on-8GB-VRAM-37088deb8fea80089187d040a6a64cc2"}, {"faq": "J1", "question": "Що таке пайплайн інпейнтингу відео?", "query": "Dynamic 8 VRAM: інпейнтинг відео в ComfyUI з маскуванням SAM3", "answer": "**Dynamic 8 VRAM** — власний пайплайн інпейнтингу відео в ComfyUI на 8 GB VRAM: контур маски (6 точок), трекінг SAM3, морфологічні фільтри, примусове звільнення VRAM перед генерацією й LTX-Video 22B (GGUF) із двома LoRA. За вимірами автора, 15 секунд відео (361 кадр) обробляються за 32 хвилини 12 секунд без падінь VRAM.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Dynamic-8-VRAM-Optimized-Video-Inpainting-Pipeline-37c88deb8fea80329005f73239dd07df"}, {"faq": "J2", "question": "Як і чому автор зробив пайплайн інпейнтингу відео?", "query": "Video Inpainting: як почав, мотивація, ComfyUI, 8 GB, самонавчання, контекст серії", "answer": "Це один з чотирьох **Independent Projects у ComfyUI**, які автор зробив приблизно за **4-5 місяців** локально на власному ноутбуці з **8 GB VRAM** (RTX 5050). Він відгукнувся на вакансію з ComfyUI на позицію trainee, відповіді не було, і він вирішив розібратися сам; допоміг досвід n8n, де вже були ноди й кастомні ноди. Автор брав стандартні шаблони й перебудовував їх, перепробовуючи багато нового. Після цього він отримав фріланс-замовлення і взявся за AI Scout Agent у n8n.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Dynamic-8-VRAM-Optimized-Video-Inpainting-Pipeline-37c88deb8fea80329005f73239dd07df"}, {"faq": "J3", "question": "Навіщо автор зробив пайплайн інпейнтингу відео?", "query": "Video Inpainting: навіщо, мотивація, артефакти, виправлення, інструмент для себе, локально", "answer": "Коли постійно стикаєшся з **артефактами** у згенерованому відео, потрібен інструмент, який їх виправляє. Тому автор **побудував такий інструмент локально для себе**: він дозволяє точково виправляти деталі, колір і елементи в кадрі, і все працює локально: за ці рішення він нічого не платив. Це була його власна відповідь на практичну проблему.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Dynamic-8-VRAM-Optimized-Video-Inpainting-Pipeline-37c88deb8fea80329005f73239dd07df"}, {"faq": "J4", "question": "Чому для масок в інпейнтингу автор вибрав SAM3?", "query": "Video Inpainting: чому SAM3, маски, трекінг об'єкта, слабке залізо, оптимальний варіант", "answer": "**SAM3** виявився **найоптимальнішим варіантом** для масок і трекінгу під цю задачу на слабкому залізі з усього, що знайшов автор. Йому передається простий контур із шести точок, і він відстежує об'єкт у всьому відео, а потім одразу вивантажується з відеопам'яті: модель уже виконала свою задачу, а на обмеженому залізі йде боротьба за кожен шматочок пам'яті, тож місце потрібне основному генератору. Порівняння з іншими моделями масок тут не наводиться.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Dynamic-8-VRAM-Optimized-Video-Inpainting-Pipeline-37c88deb8fea80329005f73239dd07df"}, {"faq": "J5", "question": "Що було найтяжчим в інпейнтингу відео?", "query": "Video Inpainting: найтяжче, флікер, мерехтіння, дрібні деталі, структура тіні колір, відео складніше за картинку", "answer": "Найтяжче було, щоб інпейнтинг **прибрав дуже дрібний елемент на обличчі**. Для цього невеликий фрагмент кадру береться й **перегенеровується** так, щоб відповідати промпту й давати ту саму структуру, тіні та колір. А головне для відео це **мерехтіння (флікер)**: на відео воно набагато помітніше, ніж на картинці. Автор працював **лише з відео**, бо воно складніше за зображення.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Dynamic-8-VRAM-Optimized-Video-Inpainting-Pipeline-37c88deb8fea80329005f73239dd07df"}, {"faq": "J6", "question": "Що автор пробував і відкидав у пайплайні інпейнтингу?", "query": "Video Inpainting: що пробував, відкинув, нестабільні шаблони, актуальність, експерименти", "answer": "Автор **перепробував усе, що було доступне на той час**, а нестабільні рішення з публічних шаблонів відкинув і зібрав воркфлоу вручну. Чи його варіанти актуальні сьогодні, він не знає: інструменти змінюються дуже швидко. Конкретні відкинуті рішення тут не перелічені.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Dynamic-8-VRAM-Optimized-Video-Inpainting-Pipeline-37c88deb8fea80329005f73239dd07df"}, {"faq": "J7", "question": "Що означає назва «Dynamic 8 VRAM»?", "query": "Dynamic 8 VRAM: що означає, динамічне виділення відеопам'яті, розбиття моделей на шматки, кастомні ноди", "answer": "**Dynamic VRAM** це вбудована в ComfyUI система керування пам'яттю: ваги моделі завантажуються у відеопам'ять **за потреби**, а за нестачі вивантажуються, тому велика 22-мільярдна модель може працювати на слабкому залізі. За схожим принципом працюють і багато оптимізаційних кастомних нод. Цифра **8** це обсяг відеопам'яті ноутбука автора. Він описує це як динамічне виділення VRAM, що розбиває модель на шматки; точніше, ваги підвантажуються на вимогу.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Dynamic-8-VRAM-Optimized-Video-Inpainting-Pipeline-37c88deb8fea80329005f73239dd07df"}, {"faq": "J8", "question": "Як великі моделі працюють на 8 GB VRAM і яка в цього ціна?", "query": "lowvram, 8 GB VRAM, підвантаження ваг VRAM RAM, ціна оптимізації, час, ComfyUI", "answer": "Автор використовує прапорець запуску **lowvram**: він дозволяє підвантажувати ваги між відеопам'яттю й оперативною, і так проходять важкі проходи на 8 GB. Це оптимізація свого роду, але **з ціною: це час**, бо обмін між VRAM і RAM сповільнює генерацію. Тому він шукав баланс між вміщенням у пам'ять і тривалістю рендеру.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Dynamic-8-VRAM-Optimized-Video-Inpainting-Pipeline-37c88deb8fea80329005f73239dd07df"}, {"faq": "J9", "question": "Як у пайплайні інпейнтингу керується тривалість і режим тесту?", "query": "Video Inpainting: керування потоком, FPS, тривалість, кадри, швидкий тест, повний рендер", "answer": "Змінні **FPS і тривалість автоматично конвертуються в кількість кадрів**, а **одним кліком** можна перемикатися між швидким тестом (наприклад, 3 секунди) і повним рендером (15 секунд).\n\nДокладніше: https://capricious-ball-d4c.notion.site/Dynamic-8-VRAM-Optimized-Video-Inpainting-Pipeline-37c88deb8fea80329005f73239dd07df"}, {"faq": "J10", "question": "Який результат дає пайплайн інпейнтингу відео?", "query": "Video Inpainting: результат, 15 секунд, 361 кадр, 32 хвилини, SAM3, LTX 22B, LoRA, до/після", "answer": "15 секунд інпейнтингу (**361 кадр при 24 fps**) із повним циклом трекінгу маски, композитингу й перегенерації обробляються за **стабільні 32 хвилини 12 секунд без падінь VRAM**. Маска будується з контуру в 6 точок через SAM3, краї підганяють морфологічні фільтри (Dilate, Erode, Grow), а генерує LTX-Video 22B (GGUF Q4_K_M) із двома LoRA (ваги 0.90 і 0.50), VideoVAE при цьому вивантажується в оперативну пам'ять. У до/після на сторінці показано видалення артефактів, корекцію деталей і кольору та заміну елемента одягу зі збереженням деталей.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Dynamic-8-VRAM-Optimized-Video-Inpainting-Pipeline-37c88deb8fea80329005f73239dd07df"}, {"faq": "K1", "question": "Що таке Seed-Funnel 10-to-1 (MiniMax H3)?", "query": "Seed-Funnel 10-to-1: пайплайн MiniMax H3 з десятьма проходам
