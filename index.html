и", "answer": "**Seed-Funnel 10-to-1** — контрольований workflow для відео на MiniMax H3: до 10 швидких тестових проходів у низькій роздільності, вибір найкращого, один refine і фінальний апскейл до 4K (RTX VSR). Промпти формують локальні Prompt Agent. За вимірами автора, 5-секундний цикл скорочено з 415 до 189 секунд (у 2,2 раза), а 20-секундне відео перевищує офіційний ліміт моделі в 15 секунд.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Seed-Funnel-The-10-to-1-MiniMax-H3-FL2VA-Pipeline-Turbo-LoRA-8GB-3ac88deb8fea801b8a2ff2765344fb6f"}, {"faq": "K2", "question": "Як і чому автор зробив Seed-Funnel на MiniMax H3?", "query": "Seed-Funnel MiniMax H3: як почав, мотивація, ComfyUI, 8 GB, MiniMax добре слухається промпта", "answer": "Це один з чотирьох **Independent Projects у ComfyUI**, які автор зробив приблизно за **4-5 місяців** локально на власному ноутбуці з **8 GB VRAM** (RTX 5050). Він відгукнувся на вакансію з ComfyUI на позицію trainee, відповіді не було, і він вирішив розібратися сам; допоміг досвід n8n, де вже були ноди й кастомні ноди. Автор брав стандартні шаблони й перебудовував їх, перепробовуючи багато нового. MiniMax H3 йому особливо сподобався, бо добре слухається промпта; після трьох проєктів у ComfyUI він зробив на ньому цю автоматизацію. Після цього він отримав фріланс-замовлення і взявся за AI Scout Agent у n8n.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Seed-Funnel-The-10-to-1-MiniMax-H3-FL2VA-Pipeline-Turbo-LoRA-8GB-3ac88deb8fea801b8a2ff2765344fb6f"}, {"faq": "K3", "question": "Звідки в автора ідея «10-to-1»?", "query": "Seed-Funnel 10-to-1: звідки ідея, перебір seed, варіації, вибір кращого, власний підхід", "answer": "До цієї ідеї автор дійшов **самостійно**, після приблизно 4 місяців експериментів і трьох попередніх проєктів у ComfyUI різного напрямку. Суть проста: **перебір seed на одному промпті** дає до 10 варіацій рендеру, з яких він обирає найкращу й лише з нею рухається далі. Він не стверджує, що перебір seed ніхто не робив раніше: це його шлях до принципу, а пайплайн навколо нього він збудував сам.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Seed-Funnel-The-10-to-1-MiniMax-H3-FL2VA-Pipeline-Turbo-LoRA-8GB-3ac88deb8fea801b8a2ff2765344fb6f"}, {"faq": "K4", "question": "Чому для Seed-Funnel автор вибрав MiniMax H3, а не LTX?", "query": "MiniMax H3 чому, LTX порівняння, 40 секунд за один прохід, Prompt Agent, open source спільнота", "answer": "Бо саме **MiniMax H3** дав змогу генерувати **40-секундне відео за один прохід** за текстовим промптом. Промпт формував **Prompt Agent**: це не одна нода, а **кілька відкритих кастомних нод**, зокрема від розробника з open source спільноти, за яким автор стежив і з яким спілкувався під його відео. Він оновлював їх і поєднував між собою у своєму пайплайні. Модель добре слухається промпта й на той час мала кілька переваг порівняно з LTX. В open source авторові подобається саме це: усі разом роблять спільну фічу, а ті, у кого вийшло, діляться результатами на різних майданчиках.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Seed-Funnel-The-10-to-1-MiniMax-H3-FL2VA-Pipeline-Turbo-LoRA-8GB-3ac88deb8fea801b8a2ff2765344fb6f"}, {"faq": "K5", "question": "Як автор подолав офіційний ліміт 15 секунд у MiniMax H3?", "query": "MiniMax H3: ліміт 15 секунд, 20 30 40 секунд, кастомні ноди, як подолав", "answer": "Автор подолав його **за рахунок різних кастомних нод**, які на той час з'являлися дуже швидко: кожен розробник із потужним залізом робив свої фічі, а він підбирав їх і адаптував під свої 8 GB. На сторінці є три відеопруфи text-to-video: **20, 30 і 40 секунд, кожен за 1 прохід (8 steps)**, тоді як розробники заявляли до 15 секунд.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Seed-Funnel-The-10-to-1-MiniMax-H3-FL2VA-Pipeline-Turbo-LoRA-8GB-3ac88deb8fea801b8a2ff2765344fb6f"}, {"faq": "K6", "question": "Чи є в автора готова автоматизація ComfyUI + n8n?", "query": "ComfyUI n8n гібрид, готова автоматизація, чи зроблено, план, ідея", "answer": "Ні, **готової гібридної автоматизації ComfyUI + n8n в автора поки нема**: це лише ідея, яку він ще не реалізував, бо постійно вчиться чи робить інші проєкти. Окремо він вміє і n8n (проєкт AI Scout), і ComfyUI (проєкти 7-10), тож технічно основи для цього в нього є.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Seed-Funnel-The-10-to-1-MiniMax-H3-FL2VA-Pipeline-Turbo-LoRA-8GB-3ac88deb8fea801b8a2ff2765344fb6f"}, {"faq": "K7", "question": "Як працює воронка «10-to-1» у Seed-Funnel?", "query": "Seed-Funnel 10-to-1: воронка, превʼю, вибір, refine, апскейл 4K, найдорожчі кроки", "answer": "Спочатку автор робить **швидкі чорнові превʼю низької роздільності**, до 10 проходів з різними seed. Потім обирає найкращого кандидата, робить **один V2V-refine** на тій самій моделі й фінальний апскейл до 4K. Найдорожчі кроки виконуються лише для обраного варіанта, а не для всіх десяти.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Seed-Funnel-The-10-to-1-MiniMax-H3-FL2VA-Pipeline-Turbo-LoRA-8GB-3ac88deb8fea801b8a2ff2765344fb6f"}, {"faq": "K8", "question": "Що таке Prompt Agent у Seed-Funnel?", "query": "Seed-Funnel: Prompt Agent, локальна LLM, структурований промпт, дві збірки, Long Media, Deno", "answer": "Це **локальний LLM-агент**, який формує структурований промпт для відеомоделі, а після цього вивантажується з пам'яті. В автора було **дві збірки**: на кастомній Long Media і стара з нодами Deno. Він звів їх разом і **по черзі використовував різні Prompt Agent**, у кожного своя LLM, тож отримував різні варіанти промпта, чорнові відео й обирав найкраще. Агентів він зібрав із відкритих кастомних нод різних авторів, а не писав з нуля; щоб поєднати несумісні ноди, довелося обходити обмеження власними милицями.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Seed-Funnel-The-10-to-1-MiniMax-H3-FL2VA-Pipeline-Turbo-LoRA-8GB-3ac88deb8fea801b8a2ff2765344fb6f"}, {"faq": "K9", "question": "Які оптимізації автор тестував у Seed-Funnel і що з них залишив?", "query": "Seed-Funnel: A/B тести, Sage Attention, EasyCache, TorchCompile, CacheDiT, Spectrum, Turbo LoRA, стабільний пресет", "answer": "Автор провів серію A/B-тестів: **Sage Attention, EasyCache, TorchCompile, CacheDiT, Spectrum, Turbo LoRA** та інші. У стабільний пресет увійшли **Sage Attention, low-VRAM attention, MiniMax H3 Cache і turbo LoRA**. Агресивніші кешування він свідомо відхилив через ризик втрати якості.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Seed-Funnel-The-10-to-1-MiniMax-H3-FL2VA-Pipeline-Turbo-LoRA-8GB-3ac88deb8fea801b8a2ff2765344fb6f"}, {"faq": "K10", "question": "Які результати дав Seed-Funnel?", "query": "Seed-Funnel: результати, 415 до 189 секунд, 20 секунд, ліміт 15, 4K, RTX VSR", "answer": "За замірами автора на його ноутбуці **5-секундний цикл скоротився з 415 до 189 секунд** (у 2,2 раза). Автор подолав офіційний ліміт моделі: згенерував **20-секундне відео** (офіційно до 15 с), а в прикладах є ролики на 30 і 40 секунд. Референси контролюються за роздільністю (960×544, кратно 32, Center Crop), а фінал проходить RTX VSR у 2 проходи до 3840×2160.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Seed-Funnel-The-10-to-1-MiniMax-H3-FL2VA-Pipeline-Turbo-LoRA-8GB-3ac88deb8fea801b8a2ff2765344fb6f"}, {"faq": "K11", "question": "Де межа пайплайна автора і що не вдалося на 40 секундах?", "query": "Seed-Funnel: 40 секунд, орел, межа, 41 секунда, out of memory, ракурси, пори року, що не вдалося", "answer": "**40 секунд це межа автора** на 8 GB: уже на **41 секунді генерація вилітала в out-of-memory**. У промпті відео з орлом прописані не лише зміна пір року, а й **зміна ракурсів, і її автор не дотиснув**. На цьому він зупинився: отримав фріланс-замовлення на AI-агента в n8n, за добу перелаштувався й почав його будувати.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Seed-Funnel-The-10-to-1-MiniMax-H3-FL2VA-Pipeline-Turbo-LoRA-8GB-3ac88deb8fea801b8a2ff2765344fb6f"}, {"faq": "K12", "question": "Що показують відео на 20 і 30 секунд?", "query": "Seed-Funnel: відео 20 секунд, 30 секунд, хамелеон, птах, задум, перша радість", "answer": "У **20-секундному** відео хамелеон повертається й дивиться в інший бік **за задумом**: він полює й крутить очима на всі боки. Яскравість луски й якість там завдяки **власному апскейлеру автора**. **30-секундне** з хамелеоном і птахом це перша радість автора: вдалося отримати **вдвічі більше за заявлені розробниками 15 секунд**, коли модель щойно вийшла.\n\nДокладніше: https://capricious-ball-d4c.notion.site/Seed-Funnel-The-10-to-1-MiniMax-H3-FL2VA-Pipeline-Turbo-LoRA-8GB-3ac88deb8fea801b8a2ff2765344fb6f"}, {"faq": "L1", "question": "Розкажи про волонтерський проєкт Post Master", "query": "AI Bot Post Master: волонтерський Telegram-інструмент для постингу", "answer": "**AI Bot Post Master** (Make, Telegram, Python, Google Sheets): волонтерський проєкт, який автор розробляв близько двох місяців безкоштовно для реальної людини з інвалідністю. Система має дві гілки: для простих оголошень і для персон (адвокат, масажист, психолог), кожна зі своїм промптом і таблицею оголошень (формули Math-модулів Make рахують циклічну подачу п'яти груп); оператор у боті обирає гілку (1 або 2) і вводить номер оголошення. Make-сценарій автор розробляв уручну близько місяця. Вона переписує й за потреби перекладає оголошення (наприклад, польською), обробляє зображення, щоразу дає нові 5 груп по колу, а публікує завжди людина: до 5 натискань, три публікації на день у вікнах 8-9, 12-13 і 17-19 без жорсткого графіка (час щоразу різний, система працює лише коли нею користується людина; правила Meta не дозволяють повної автоматизації). За словами автора, проблем із Meta не було. Автор каже, що автоматизація працювала за призначенням і вкладалась у безкоштовні 1000 кредитів Make; за її допомогою закрито першу вакансію. Є відеовідгук користувача, який автор може показати особисто; публічно його немає з етичних міркувань. Чи використовується зараз, автор не знає.\n\nНа сторінці проєкту є скріншот бота з реальним оголошенням (за словами автора, з згоди його авторки) і п'ятьма кнопками для груп.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Automation-Accessibility-Volunteer-Project-AI-Bot-Post-Master-2b888deb8fea800dbc30f5ef29aa24e9"}, {"faq": "L2", "question": "Як у Post Master працюють дві гілки (прості оголошення і персони)?", "query": "Post Master: гілки, персони, прості оголошення, оператор, код", "answer": "У **Post Master** дві гілки: для простих оголошень (наприклад, продаж велосипеда) і для **персон**: фахівців, які рекламують себе (адвокат, масажист, психолог). У кожної гілки свій промпт і своя таблиця Google Sheets з даними оголошень та постійним посиланням на зображення (файли в Dropbox). Оператор у боті обирає гілку (1 це персона, 2 це просте оголошення), вводить номер оголошення з таблиці, а система за фільтрами Make запускає потрібну гілку й надсилає готовий пакет: текст, зображення й п'ять кнопок для груп.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Automation-Accessibility-Volunteer-Project-AI-Bot-Post-Master-2b888deb8fea800dbc30f5ef29aa24e9"}, {"faq": "L3", "question": "Який масштаб мав Post Master на практиці?", "query": "Post Master: скільки груп, публікацій, операторів, масштаб", "answer": "За словами автора, він супроводжував роботу системи приблизно місяць. У списку було **55 груп** (великі українські групи оголошень у Варшаві). Публікація йшла тричі на день з одного акаунта, щоразу у **5 різних груп** (до 15 публікацій на добу). Користувач був один: система розрахована на кількох операторів, але двоє не вкладались у безкоштовний ліміт 1000 кредитів Make.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Automation-Accessibility-Volunteer-Project-AI-Bot-Post-Master-2b888deb8fea800dbc30f5ef29aa24e9"}, {"faq": "L4", "question": "Як Post Master робить оголошення унікальними і чи це не спам?", "query": "Post Master: унікальність, спам, правила Meta, Python, водяний знак", "answer": "Кожне оголошення AI переписує, а Python-скрипт обробляє зображення: змінює колір рамки, злегка обрізає край і додає невидимий водяний знак. За словами автора, мета в тому, щоб кожне оголошення виглядало окремим, а не в обході правил платформи. Спаму автор не хотів, тому публікує завжди **людина** (до 5 натискань), три публікації на день у вікнах 8-9, 12-13 і 17-19 без жорсткого графіка, а повна автоматизація не робилась, бо правила Meta її не дозволяють. За словами автора, проблем із Meta не було.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Automation-Accessibility-Volunteer-Project-AI-Bot-Post-Master-2b888deb8fea800dbc30f5ef29aa24e9"}, {"faq": "L5", "question": "Навіщо автор створив Post Master і що з цього вийшло?", "query": "Post Master: мета, мотивація, результат, перша вакансія, відеовідгук", "answer": "Автор створив **Post Master** у першу чергу, щоб люди з обмеженими можливостями могли заробляти з телефону. Він працював над проєктом близько двох місяців безкоштовно для реальної людини з інвалідністю, яка працювала з рекрутинговою агенцією. За словами автора, автоматизація виконувала своє призначення, а за її допомогою закрито першу вакансію. Складнощі були не в автоматизації, а в обмеженнях платформи (ручна публікація за правилами Meta) і в моделі оплати рекрутингу (платять після двох відпрацьованих тижнів кандидата). Чи використовується зараз, автор не знає. Є відеовідгук користувача, який автор може показати особисто; публічно його немає з етичних міркувань.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Automation-Accessibility-Volunteer-Project-AI-Bot-Post-Master-2b888deb8fea800dbc30f5ef29aa24e9"}, {"faq": "L6", "question": "Чи має Post Master розклад публікацій?", "query": "Post Master: розклад, графік, час публікацій, human-in-the-loop", "answer": "Розкладу автоматичних публікацій немає навмисно, щоб це не виглядало як спам-машина. Оператору дано інструкцію публікувати тричі на день у вікнах 8-9, 12-13 і 17-19. Час запуску щоразу різний, бо Python-скрипт лежить на безкоштовному хості, який прокидається по-різному. Система працює лише тоді, коли нею користується людина: це напівавтоматична автоматизація з human-in-the-loop.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Automation-Accessibility-Volunteer-Project-AI-Bot-Post-Master-2b888deb8fea800dbc30f5ef29aa24e9"}, {"faq": "L7", "question": "Як у Post Master працює циклічна ротація п'яти груп?", "query": "Post Master: ротація груп, Math, формули, циклічна подача", "answer": "Кожен оператор має власний індекс у таблиці, а в сценарії Make є модулі **Math** (значок «π») із формулами циклічної подачі: вони обчислюють, які п'ять груп і посилання підставити в кнопки для цього запиту. Так щоразу оператор отримує наступні групи зі списку по колу, з урахуванням свого прогресу.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Automation-Accessibility-Volunteer-Project-AI-Bot-Post-Master-2b888deb8fea800dbc30f5ef29aa24e9"}, {"faq": "L8", "question": "Які модель і технології використані в Post Master?", "query": "Post Master: технології, AI-модель, Python, хост", "answer": "У **Post Master** AI-модель OpenAI (через Make) переписувала й перекладала оголошення, мову визначали промпт і текст у таблиці. Зображення обробляв Python-скрипт на безкоштовному хості Render, який Make викликав HTTP-запитом. Таблиці й доступи в Google Sheets, зображення в Dropbox, інтерфейс Telegram-бот. Витрати були лише на AI-модель.\n\nДокладніше: https://capricious-ball-d4c.notion.site/AI-Automation-Accessibility-Volunteer-Project-AI-Bot-Post-Master-2b888deb8fea800dbc30f5ef29aa24e9"}, {"faq": "L9", "question": "Як у Post Master працює доступ і статистика?", "query": "Post Master: доступ, Telegram ID, статистика операторів", "answer": "Доступ до бота дає **таблиця Telegram ID**: кого немає в списку, той не користується системою (захист від сторонніх). У Google Sheets за Telegram ID відстежується активність кожного оператора, а також загальна статистика за днями, тижн <script>
const { groups, rows } = JSON.parse(document.getElementById('data').textContent);
const list = document.getElementById('list');
const nav = document.getElementById('groups');
const search = document.getElementById('search');
const params = new URLSearchParams(location.search);
const requested = (params.get('q') || location.hash.slice(1)).trim().toUpperCase();
let group = rows.some(r => r.faq === requested) ? requested[0] : 'A';

const escapeHtml = s => s.replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const inline = s => s
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/https?:\/\/[^\s<]*[^\s<.,;:)]/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.includes('notion.site') ? 'сторінка проєкту' : u}</a>`);

function markdown(text) {
  return escapeHtml(text).split(/\n{2,}/).map(block => {
    const lines = block.split('\n');
    if (lines.every(l => /^[-*] /.test(l))) return '<ul>' + lines.map(l => `<li>${inline(l.slice(2))}</li>`).join('') + '</ul>';
    return `<p>${lines.map(inline).join('<br>')}</p>`;
  }).join('');
}

function matches(term) {
  const code = term.toUpperCase();
  if (rows.some(r => r.faq === code)) return rows.filter(r => r.faq === code);
  const words = term.toLowerCase().split(/\s+/);
  return rows.filter(r => {
    const hay = `${r.question} ${r.query} ${r.answer}`.toLowerCase();
    return words.every(w => hay.includes(w));
  });
}

function render(openCode) {
  const term = search.value.trim();
  const shown = term ? matches(term) : rows.filter(r => r.faq[0] === group);
  for (const b of nav.children) b.setAttribute('aria-pressed', String(!term && b.dataset.group === group));
  list.innerHTML = '';
  let current = '';
  for (const r of shown) {
    if (r.faq[0] !== current) {
      current = r.faq[0];
      list.insertAdjacentHTML('beforeend', `<h2>${current}. ${escapeHtml(groups[current])}</h2>`);
    }
    const item = document.createElement('details');
    item.id = r.faq;
    item.open = r.faq === openCode || shown.length === 1;
    item.innerHTML = `<summary><span class="code">${r.faq}</span><span>${escapeHtml(r.question)}</span></summary><div class="answer">${markdown(r.answer)}</div>`;
    item.querySelector('summary').addEventListener('click', () => {
      if (!item.open) history.replaceState(null, '', `?q=${r.faq}`);
    });
    list.appendChild(item);
  }
  if (!shown.length) list.innerHTML = '<p class="empty">У готових відповідях цього немає.</p>';
}

for (const [letter, name] of Object.entries(groups)) {
  const button = document.createElement('button');
  button.type = 'button';
  button.dataset.group = letter;
  button.textContent = `${letter} · ${name}`;
  button.addEventListener('click', () => { group = letter; search.value = ''; render(); });
  nav.appendChild(button);
}
search.addEventListener('input', () => render());
render(requested);
if (requested) document.getElementById(requested)?.scrollIntoView({ block: 'center' });
</script>
</body>
